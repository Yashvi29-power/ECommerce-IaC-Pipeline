name: Container Security Scan - Trivy

on:
  push:
    branches:
      - feature/container-security
  pull_request:
    branches:
      - main

jobs:
  trivy-image-scan:
    runs-on: ubuntu-latest
    name: Trivy Docker Image Scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Build Docker Image
        run: |
          docker build --no-cache -t ecommerce-app:latest app/

      - name: Run Trivy Image Scan
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --format table ecommerce-app:latest

      - name: Generate Trivy SARIF Report
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --format sarif --output trivy-image-report.sarif ecommerce-app:latest

      - name: Upload Trivy Image Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.sarif

  trivy-filesystem-scan:
    runs-on: ubuntu-latest
    name: Trivy Filesystem Dependency Scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy Filesystem Scan
        run: |
          trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --format table app/

      - name: Generate Trivy Filesystem SARIF Report
        run: |
          trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --format sarif --output trivy-fs-report.sarif app/

      - name: Upload Trivy Filesystem Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.sarif
